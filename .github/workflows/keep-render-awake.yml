# Ping the combined free Render service so cold starts are less common.
# Free instance hours are limited — disable this workflow on paid always-on plans.
name: Keep Render awake

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake combined app
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL:-https://ai-chrms.onrender.com}"

          echo "Pinging $APP_URL/health …"
          curl -fsS --max-time 90 "$APP_URL/health" || true

          echo "Pinging $APP_URL/ …"
          curl -fsS --max-time 90 "$APP_URL/" || true

          echo "Done."
