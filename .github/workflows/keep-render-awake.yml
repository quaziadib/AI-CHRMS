# Ping both free Render services so they tend to wake / stay up together.
# Free instance hours are limited — disable this workflow if you upgrade to paid
# always-on plans or if you hit the monthly hour cap.
name: Keep Render awake

on:
  schedule:
    # Every 12 minutes (Render free sleeps after ~15m idle)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and frontend
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL }}
        run: |
          set -euo pipefail
          BACKEND_URL="${BACKEND_URL:-https://ai-chrms-backend.onrender.com}"
          FRONTEND_URL="${FRONTEND_URL:-https://ai-chrms-frontend.onrender.com}"

          echo "Pinging backend health…"
          curl -fsS --max-time 90 "$BACKEND_URL/health" || true

          echo "Pinging frontend (wakes API via /backend-health)…"
          curl -fsS --max-time 90 "$FRONTEND_URL/backend-health" \
            || curl -fsS --max-time 90 "$FRONTEND_URL/" \
            || true

          echo "Done."
