services:
  # One free web service runs Next.js + FastAPI together so they sleep/wake
  # as a single unit. Split frontend/backend services on free tier leave the
  # UI up while the API is still cold.
  - type: web
    name: ai-chrms
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "0"
      - key: DB_INIT_ON_STARTUP
        value: "false"
      - key: SEED_DEMO_USERS
        value: "false"
      - key: SEED_SYNTHETIC_DATA
        value: "false"
      - key: ENABLE_FORECASTING
        value: "false"
      - key: ENABLE_POPULATION_FORECASTING
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "[]"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: ENABLE_CHATBOT
        value: "false"
      - key: ENABLE_RAG
        value: "false"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
